  SW-05: { name: "data-ml",        industry: data,     members: { leader: 1, workers: 3, critic: 1 }, domains: [ml-data, data-engineering, data-analysis], source: reference }
  SW-06: { name: "infra",          industry: software, members: { leader: 1, workers: 2, critic: 1 }, domains: [infra-ops, security], source: production }
