# Millforge 模板片段注册表（编译器 Assemble 段消费）
# 出处三级纪律：source: production(实测) | reference(文档/审查) | llm(待整队实测→experimental)
# 每个片段声明：id / file / applies_to(角色种类) / 行预算估算 / source / 触发装载(常驻|按需)
version: "1.0"

skeletons:
  coordinator:
    file: templates/skeleton/coordinator.md
    budget: 500
    source: production
  leader:
    file: templates/skeleton/leader.md
    budget: 250
    source: production
  worker:
    file: templates/skeleton/worker.md
    budget: 150
    source: production
  critic:
    file: templates/skeleton/critic.md
    budget: 150
    source: production

# ── T1 行业模板（5+2，O5）：行业级差异片段 ─────────────────────────
industry:
  software:
    file: templates/industry/software.md
    source: production
    applies_to: [worker, leader, critic]
  embedded:
    file: templates/industry/embedded.md
    source: production
    applies_to: [worker, leader]
  data:
    file: templates/industry/data.md
    source: reference
    applies_to: [worker, leader]
  content:
    file: templates/industry/content.md
    source: reference
    applies_to: [worker, leader]
  business:
    file: templates/industry/business.md
    source: llm
    experimental: true
    applies_to: [worker, leader]
  custom:
    file: templates/industry/custom.md
    source: llm
    experimental: true
    applies_to: [worker, leader]

# ── T2 域片段（21 个，O5 矩阵）──────────────────────────────────
domains:
  # 软件 10 子域
  web-frontend: { industry: software, file: templates/domain/web-frontend.md,  source: production, applies_to: [worker] }
  web-backend: { industry: software, file: templates/domain/web-backend.md,   source: production, applies_to: [worker] }
  mobile: { industry: software, file: templates/domain/mobile.md,        source: production, applies_to: [worker] }
  desktop: { industry: software, file: templates/domain/desktop.md,       source: reference,  applies_to: [worker] }
  ml-data: { industry: software, file: templates/domain/ml-data.md,       source: reference,  applies_to: [worker] }
  infra-ops: { industry: software, file: templates/domain/infra-ops.md,     source: production, applies_to: [worker] }
  security: { industry: software, file: templates/domain/security.md,      source: reference,  applies_to: [worker, critic] }
  docs-content: { industry: software, file: templates/domain/docs-content.md,  source: production, applies_to: [worker] }
  test-qa: { industry: software, file: templates/domain/test-qa.md,       source: reference,  applies_to: [worker, critic] }
  data-engineering: { industry: software, file: templates/domain/data-engineering.md, source: reference, applies_to: [worker] }
  # 嵌入式 4
  mcu: { industry: embedded, file: templates/domain/mcu.md,           source: production, applies_to: [worker] }
  embedded-linux: { industry: embedded, file: templates/domain/embedded-linux.md, source: reference, applies_to: [worker] }
  hardware-bridge: { industry: embedded, file: templates/domain/hardware-bridge.md, source: production, applies_to: [worker] }
  rtos-firmware: { industry: embedded, file: templates/domain/rtos-firmware.md, source: reference, applies_to: [worker] }
  # 数据 2
  data-analysis: { industry: data, file: templates/domain/data-analysis.md, source: production, applies_to: [worker] }
  data-visualization: { industry: data, file: templates/domain/data-visualization.md, source: reference, applies_to: [worker] }
  # 市场 2
  market-research: { industry: business, file: templates/domain/market-research.md, source: llm, experimental: true, applies_to: [worker] }
  sales-outreach: { industry: business, file: templates/domain/sales-outreach.md,  source: llm, experimental: true, applies_to: [worker] }
  # 通用 3
  office-productivity: { industry: general, file: templates/domain/office-productivity.md, source: reference, applies_to: [worker] }
  research-reports: { industry: general, file: templates/domain/research-reports.md, source: production, applies_to: [worker] }
  general: { industry: general, file: templates/domain/general.md,       source: llm, experimental: true, applies_to: [worker] }

# ── 协议片段（由 team.json protocol 开关选择，非域片段）──────────
protocol:
  nmh:             { file: templates/fragments/nmh.md,         resident: true,  source: production }
  nma:             { file: templates/fragments/nma.md,         resident: false, source: production, trigger: "任务提交/验收请求到达" }
  five-clauses:    { file: templates/fragments/five-clauses.md, resident: true,  source: production }
  task-lifecycle:  { file: templates/fragments/task-lifecycle.md, resident: true, source: production }
  dual-channel:    { file: templates/fragments/dual-channel.md, resident: true,  source: production }
  fuse:            { file: templates/fragments/fuse.md,        resident: true,  source: production }
  loop:            { file: templates/fragments/loop.md,        resident: false, source: reference,  trigger: "收到 loop_spec / iteration > 1" }
  signal:          { file: templates/fragments/signal.md,      resident: true,  source: reference }
  handoff:         { file: templates/fragments/handoff.md,     resident: false, source: production, trigger: "跨团队任务（仅 single_user 编译）", single_user_only: true }
  contract:        { file: templates/fragments/contract.md,    resident: false, source: reference,  trigger: "task spec 含 contract_refs" }
  governance:      { file: templates/fragments/governance.md,  resident: false, source: reference,  trigger: "R5 重开/投票/attention 升级" }
  attention-ux:    { file: templates/fragments/attention-ux.md, resident: false, source: reference,  trigger: "CAP-ATTN request 到达（持久展示面应答面）" }

