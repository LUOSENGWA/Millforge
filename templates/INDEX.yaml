  SW-08: { name: "fullstack",      industry: software, members: { leader: 1, workers: 5, critic: 1 }, domains: [web-frontend, web-backend, mobile, test-qa, infra-ops], source: reference }
  EH-01: { name: "mcu-project",    industry: embedded, members: { leader: 1, workers: 3, critic: 1 }, domains: [mcu, rtos-firmware, hardware-bridge], source: production }
  EH-02: { name: "embedded-linux", industry: embedded, members: { leader: 1, workers: 2, critic: 1 }, domains: [embedded-linux, hardware-bridge], source: reference }
  EH-03: { name: "hw-integration", industry: embedded, members: { leader: 1, workers: 3, critic: 1 }, domains: [mcu, embedded-linux, hardware-bridge, infra-ops], source: production }
  EH-04: { name: "firmware",       industry: embedded, members: { leader: 1, workers: 2, critic: 1 }, domains: [rtos-firmware, mcu], source: reference }
  DA-01: { name: "analytics",      industry: data,     members: { leader: 1, workers: 2, critic: 1 }, domains: [data-analysis, data-visualization], source: production }
  DA-02: { name: "bi-dashboard",   industry: data,    members: { leader: 1, workers: 3, critic: 1 }, domains: [data-analysis, data-visualization, data-engineering], source: reference }
  MS-01: { name: "market-intel",   industry: business, members: { leader: 1, workers: 2, critic: 1 }, domains: [market-research, sales-outreach], source: llm, experimental: true }
  MS-02: { name: "biz-ops",        industry: business, members: { leader: 1, workers: 3, critic: 1 }, domains: [office-productivity, research-reports, data-analysis], source: llm, experimental: true }
  GEN-01: { name: "generalist",    industry: null,     members: { leader: 1, workers: 2, critic: 1 }, domains: [general, office-productivity, research-reports], source: llm, experimental: true }
